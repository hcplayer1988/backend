services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vv90
      POSTGRES_USER: vv90
      POSTGRES_PASSWORD: vv90dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vv90 -d vv90"]
      interval: 3s
      timeout: 3s
      retries: 10
 
  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: vv90
      DB_USER: vv90
      DB_PASSWORD: vv90dev
      DB_HOST: db
      DB_PORT: 5432
 
volumes:
  postgres_data:
 